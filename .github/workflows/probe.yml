name: Probe
on:
  push:
    branches: [probe]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: pip install requests
      - run: |
          python - <<'PY'
          import requests, re
          H={"User-Agent":"Mozilla/5.0"}
          t=requests.get("https://www.fundsdata.co.za/summary.aspx?c=CPSVFH",headers=H,timeout=30).text
          print("LEN",len(t))
          for m in sorted(set(re.findall(r'(?:href|src|action)=["\']([^"\']+)["\']',t))): 
              if ".css" not in m and ".png" not in m and ".gif" not in m: print("LINK",m[:200])
          for k in ["TRI","Latest Price","Formation","prices.aspx","Prices","history","Historic","csv","Export","Download"]:
              for i in [m.start() for m in re.finditer(re.escape(k),t)][:3]:
                  print("CTX",k,"->",re.sub(r"\s+"," ",t[max(0,i-120):i+160]))
          for u in ["https://www.fundsdata.co.za/prices.aspx?c=CPSVFH","https://www.fundsdata.co.za/fundprices.aspx?c=CPSVFH","https://www.fundsdata.co.za/history.aspx?c=CPSVFH","https://www.fundsdata.co.za/charting.aspx?c=CPSVFH"]:
              r=requests.get(u,headers=H,timeout=30); print("TRY",u,r.status_code,len(r.text))
          PY
